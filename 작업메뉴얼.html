<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="screen-orientation" content="landscape">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>작업 메뉴얼 PPT — 출발일 차량점검</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: #0f172a;
            color: #222;
            display: flex;
            overflow: hidden;
        }

        /* iOS 등 Fullscreen API 불가 시: 뷰포트 전체 덮는 대체 전체화면 */
        html.pseudo-fs, html.pseudo-fs body {
            width: 100% !important;
            height: 100% !important;
            height: 100dvh !important;
            min-height: 100dvh !important;
            overflow: hidden !important;
            overscroll-behavior: none;
            background: #0f172a;
            touch-action: none;
        }
        html.pseudo-fs body.force-landscape {
            width: 100dvh !important;
            height: 100dvw !important;
            min-height: 0 !important;
        }

        .app-shell {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0;
            width: 100%;
            height: 100%;
        }

        .viewer-wrap {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            padding: 0;
        }

        .ppt-stage {
            flex: 1;
            min-width: 0;
            min-height: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            border-radius: 0;
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
        }
        .ppt-stage img {
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            object-fit: contain;
            object-position: center;
            display: block;
            background: #020617;
        }
        /* 좌측 상단 비밀 영역: PC만 · 모양 없음 · 올리면 클릭 가능 */
        .secret-hotspot {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 44px;
            height: 44px;
            z-index: 40;
            opacity: 0;
            cursor: default;
            border: none;
            padding: 0;
            margin: 0;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
        }
        @media (pointer: fine) and (min-width: 900px) {
            .secret-hotspot { display: block; }
            .secret-hotspot:hover,
            .secret-hotspot:focus {
                cursor: pointer;
                outline: none;
            }
        }

        /* 오른쪽 세로 레일: 돌아가기 / 3D / 페이지 */
        .side-rail {
            flex: 0 0 auto;
            width: 76px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 8px;
            padding: 8px 6px;
            background: #0b1220;
            border-left: 1px solid rgba(148, 163, 184, 0.2);
            z-index: 20;
            margin-left: auto; /* 항상 우측 */
        }
        .side-rail .side-page {
            position: absolute;
            left: 6px;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
        }
        .side-rail .nav-btn {
            width: 100%;
            padding: 10px 4px;
            border: none;
            border-radius: 8px;
            font-size: 0.72em;
            font-weight: bold;
            line-height: 1.25;
            cursor: pointer;
            white-space: pre-line;
            text-align: center;
            transition: 0.15s;
        }
        .side-rail .nav-btn.back {
            background: #6c757d;
            color: #fff;
        }
        .side-rail .nav-btn.back:hover { background: #5a6268; }
        .side-rail .nav-btn.view3d {
            background: #6f42c1;
            color: #fff;
            box-shadow: 0 2px 6px rgba(111,66,193,0.35);
        }
        .side-rail .nav-btn.view3d:hover { background: #5a32a3; }
        .side-rail .nav-btn.ppt-dl {
            background: #0ea5e9;
            color: #fff;
        }
        .side-rail .nav-btn.ppt-dl:hover { background: #0284c7; }
        .admin-ppt-tools {
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .admin-ppt-tools.show { display: flex; }
        .admin-ppt-status {
            display: none;
            font-size: 0.62em;
            color: #94a3b8;
            text-align: center;
            line-height: 1.3;
            padding: 0 2px;
        }
        .admin-ppt-tools.show .admin-ppt-status.has-msg { display: block; }

        .side-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #e2e8f0;
            padding-bottom: 4px;
        }
        .side-page .page {
            font-size: 0.78em;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            text-align: center;
            line-height: 1.2;
            opacity: 0.95;
        }
        .side-page .page-btns {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }
        .side-page .page-btns button {
            width: 100%;
            padding: 8px 0;
            border: none;
            border-radius: 7px;
            background: rgba(148, 163, 184, 0.22);
            color: #fff;
            font-size: 0.78em;
            font-weight: bold;
            cursor: pointer;
        }
        .side-page .page-btns button:disabled {
            opacity: 0.35;
            cursor: default;
        }
        .side-page .page-btns button:not(:disabled):hover {
            background: rgba(167, 139, 250, 0.55);
        }

        /* PC: PPT는 전체 영역, 버튼 레일은 오른쪽에 고정 */
        @media (pointer: fine) and (min-width: 900px) {
            .app-shell { position: relative; }
            .viewer-wrap {
                position: absolute;
                inset: 0;
                padding: 0;
                z-index: 1;
            }
            .side-rail {
                position: absolute;
                top: 0;
                right: 0;
                left: auto;
                bottom: 0;
                width: 72px;
                margin-left: 0;
                z-index: 30;
                background: rgba(11, 18, 32, 0.78);
                border-left: 1px solid rgba(148, 163, 184, 0.28);
                backdrop-filter: blur(4px);
            }
            .ppt-stage img {
                width: 100%;
                height: 100%;
            }
        }

        .depart-loading {
            display: none; position: fixed; inset: 0; z-index: 9999;
            background: #0f172a; color: #fff; text-align: center;
            flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        .depart-loading.show { display: flex; }
        .depart-loading .spinner {
            width: 52px; height: 52px; border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.22); border-top-color: #a78bfa;
            animation: departSpin 0.85s linear infinite;
        }
        @keyframes departSpin { to { transform: rotate(360deg); } }

        /* 모바일 세로: 묻지 않고 바로 가로 배치 (시계 +90° = 폰을 왼쪽으로 돌린 화면) */
        body.force-landscape {
            position: fixed;
            top: 0;
            left: 100%;
            right: auto;
            bottom: auto;
            width: 100vh;
            height: 100vw;
            max-width: none;
            transform: rotate(90deg);
            transform-origin: top left;
            overflow: hidden;
        }
        body.force-landscape .side-rail {
            width: 68px;
            padding: 6px 4px;
            gap: 6px;
        }
        body.force-landscape .side-rail .side-page {
            left: 4px;
            right: 4px;
        }
        body.force-landscape .side-rail .nav-btn {
            padding: 8px 2px;
            font-size: 0.68em;
        }
        body.force-landscape .viewer-wrap { padding: 2px 0 2px 2px; }

        /* 모바일: 전체화면용 필수 터치 안내 */
        .touch-gate {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(15, 23, 42, 0.94);
            color: #fff;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 28px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .touch-gate.show { display: flex; }
        .touch-gate .hand {
            font-size: 2.6em;
            animation: touchPulse 1.2s ease-in-out infinite;
        }
        .touch-gate p {
            margin: 0;
            font-size: 1.35em;
            font-weight: bold;
            letter-spacing: -0.02em;
        }
        .touch-gate small {
            font-size: 0.95em;
            opacity: 0.8;
            font-weight: normal;
        }
        @keyframes touchPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.12); opacity: 0.75; }
        }

        @media (orientation: landscape) and (max-height: 420px) {
            .side-rail { width: 62px; padding: 4px 3px; gap: 5px; }
            .side-rail .nav-btn { padding: 7px 2px; font-size: 0.64em; }
            .side-page .page { font-size: 0.7em; }
            .viewer-wrap { padding: 2px 0 2px 2px; }
        }
    </style>
</head>
<body>
<script>
(function () {
    var mobile = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)
        || Math.min(screen.width, screen.height) < 600;
    var portrait = window.innerHeight > window.innerWidth;
    if (mobile && portrait) document.documentElement.classList.add("force-landscape-pending");
})();
</script>
<style>
/* JS 로드 전 깜빡임 방지 · body.force-landscape 와 동일 변환(한쪽만 적용) */
html.force-landscape-pending body:not(.force-landscape) {
    position: fixed; top: 0; left: 100%; width: 100vh; height: 100vw;
    transform: rotate(90deg); transform-origin: top left; overflow: hidden;
}
</style>
    <div class="depart-loading" id="departLoading" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p style="margin:0;font-weight:bold;">로딩 중…</p>
        <small style="opacity:0.75;">3D 화면으로 이동하고 있습니다</small>
    </div>

    <div class="touch-gate" id="touchGate" role="button" tabindex="0" aria-label="화면을 터치하세요">
        <div class="hand" aria-hidden="true">👆</div>
        <p>화면을 터치하세요</p>
        <small>터치하면 화면을 가득 채워 메뉴얼이 시작됩니다</small>
    </div>

    <div class="app-shell">
        <div class="viewer-wrap">
            <div class="ppt-stage" id="pptStage">
                <img id="slideImg" alt="작업 메뉴얼 슬라이드" draggable="false">
                <button type="button" class="secret-hotspot" id="secretHotspot" title="" aria-label="관리 메뉴" tabindex="-1"></button>
            </div>
        </div>
        <aside class="side-rail" aria-label="메뉴얼 조작">
            <button class="nav-btn back" type="button" onclick="goBack()">돌아가기</button>
            <button class="nav-btn view3d" type="button" onclick="open3D()">3D로<br>보기</button>
            <div class="admin-ppt-tools" id="adminPptTools" aria-hidden="true">
                <button class="nav-btn ppt-dl" type="button" id="pptDownloadBtn">PPT<br>다운</button>
                <div class="admin-ppt-status" id="adminPptStatus"></div>
            </div>
            <div class="side-page">
                <span class="page" id="pageLabel">1 / 11</span>
                <div class="page-btns">
                    <button type="button" id="prevBtn" aria-label="이전 슬라이드">이전</button>
                    <button type="button" id="nextBtn" aria-label="다음 슬라이드">다음</button>
                </div>
            </div>
        </aside>
    </div>

<script>
const SLIDE_COUNT = 11;
const SLIDE_BASE = "img/manual-ppt/slide-";
const DEFAULT_PPTX_URL = "img/\uD1B5\uD559\uBC84\uC2A4 \uC548\uC804\uC810\uAC80 \uBA54\uB274\uC5BC.pptx";
const PPT_DOWNLOAD_NAME = "\uCD9C\uBC1C\uC77C_\uCC28\uB7C9\uC810\uAC80_\uBA54\uB274\uC5BC.pptx";

let slideIndex = 0;
let touchX = null;
let adminToolsOpen = false;

function pad2(n) { return String(n).padStart(2, "0"); }
function slideSrc(i) { return SLIDE_BASE + pad2(i + 1) + ".png"; }
function isPcAdmin() {
    return !isMobile() && !!(window.matchMedia && window.matchMedia("(pointer: fine)").matches)
        && window.innerWidth >= 900;
}

function isMobile() {
    return (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)
        || Math.min(screen.width, screen.height) < 600;
}

function isPortrait() {
    if (window.matchMedia) return window.matchMedia("(orientation: portrait)").matches;
    return window.innerHeight > window.innerWidth;
}

function isNativeFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}

function isFullscreen() {
    return isNativeFullscreen() || document.documentElement.classList.contains("pseudo-fs");
}

function applyPseudoFullscreen() {
    document.documentElement.classList.add("pseudo-fs");
    document.body.classList.add("pseudo-fs");
    setTimeout(() => { try { window.scrollTo(0, 1); } catch (_) {} }, 50);
}

function clearPseudoFullscreen() {
    document.documentElement.classList.remove("pseudo-fs");
    document.body.classList.remove("pseudo-fs");
}

function exitFullscreen() {
    clearPseudoFullscreen();
    const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (ex && isNativeFullscreen()) {
        try { return Promise.resolve(ex.call(document)).catch(() => {}); }
        catch (_) {}
    }
    return Promise.resolve();
}

function tryNativeFullscreen() {
    if (isNativeFullscreen()) return Promise.resolve(true);
    const tryEl = (el) => {
        const req = el && (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
        if (!req) return Promise.reject(new Error("no-api"));
        try {
            return Promise.resolve(req.call(el, { navigationUI: "hide" })).then(() => true);
        } catch (err) {
            return Promise.reject(err);
        }
    };
    return tryEl(document.documentElement)
        .catch(() => tryEl(document.body))
        .catch(() => false);
}

function enterFullscreen() {
    // 가로 CSS는 유지 · 풀었다 넣으면 화면이 도는 것처럼 보임
    applyPseudoFullscreen();
    return tryNativeFullscreen().then((ok) => ok);
}

function goBack() {
    // PPT → 선생님 명단(index)
    exitFullscreen().finally(() => {
        location.href = "index.html";
    });
}

function open3D() {
    const go = () => {
        if (isMobile()) {
            const load = document.getElementById("departLoading");
            if (load) load.classList.add("show");
            requestAnimationFrame(() => {
                setTimeout(() => { location.href = "점검메뉴얼3D.html?view=wide"; }, 40);
            });
            return;
        }
        location.href = "점검메뉴얼3D.html";
    };
    exitFullscreen().finally(go);
}

function dismissTouchGate() {
    const gate = document.getElementById("touchGate");
    if (gate) gate.classList.remove("show");
}

function armTouchGate() {
    if (!isMobile()) return;
    const gate = document.getElementById("touchGate");
    if (!gate) return;
    gate.classList.add("show");

    let done = false;
    const start = () => {
        if (done) return;
        done = true;
        enterFullscreen().finally(() => {
            dismissTouchGate();
        });
    };
    gate.addEventListener("click", start);
    gate.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") start();
    });
}

function setAdminStatus(msg) {
    const el = document.getElementById("adminPptStatus");
    if (!el) return;
    el.textContent = msg || "";
    el.classList.toggle("has-msg", !!msg);
}

function updateAdminToolsUi() {
    const tools = document.getElementById("adminPptTools");
    const open = adminToolsOpen && isPcAdmin();
    if (tools) {
        tools.classList.toggle("show", open);
        tools.setAttribute("aria-hidden", open ? "false" : "true");
    }
    if (!isPcAdmin()) adminToolsOpen = false;
}

function toggleAdminTools() {
    if (!isPcAdmin()) return;
    adminToolsOpen = !adminToolsOpen;
    updateAdminToolsUi();
}

function showSlide(i) {
    slideIndex = Math.max(0, Math.min(SLIDE_COUNT - 1, i));
    const img = document.getElementById("slideImg");
    img.src = slideSrc(slideIndex);
    img.alt = "작업 메뉴얼 슬라이드 " + (slideIndex + 1);
    document.getElementById("pageLabel").textContent = (slideIndex + 1) + " / " + SLIDE_COUNT;
    document.getElementById("prevBtn").disabled = slideIndex === 0;
    document.getElementById("nextBtn").disabled = slideIndex === SLIDE_COUNT - 1;
}

async function downloadCurrentPpt() {
    if (!isPcAdmin()) return;
    try {
        setAdminStatus("다운로드 준비 중…");
        const res = await fetch(DEFAULT_PPTX_URL);
        if (!res.ok) throw new Error("기본 PPT 파일을 찾을 수 없습니다.");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = PPT_DOWNLOAD_NAME;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        setAdminStatus("다운로드 시작됨");
    } catch (err) {
        console.error(err);
        setAdminStatus("다운로드 실패");
        alert("PPT 다운로드에 실패했습니다.");
    }
}

function updateLandscapeUi() {
    const on = isMobile() && isPortrait();
    document.body.classList.toggle("force-landscape", on);
    document.documentElement.classList.remove("force-landscape-pending");
    if (on) document.documentElement.classList.add("force-landscape-pending");
}

(function init() {
    updateLandscapeUi();
    showSlide(0);
    for (let i = 1; i < SLIDE_COUNT; i++) {
        const pre = new Image();
        pre.src = slideSrc(i);
    }

    document.getElementById("prevBtn").onclick = () => showSlide(slideIndex - 1);
    document.getElementById("nextBtn").onclick = () => showSlide(slideIndex + 1);

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") showSlide(slideIndex - 1);
        if (e.key === "ArrowRight" || e.key === "ArrowDown") showSlide(slideIndex + 1);
    });

    const stage = document.getElementById("pptStage");
    stage.addEventListener("touchstart", (e) => {
        if (!e.changedTouches || !e.changedTouches.length) return;
        touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    stage.addEventListener("touchend", (e) => {
        if (touchX == null || !e.changedTouches || !e.changedTouches.length) return;
        const dx = e.changedTouches[0].clientX - touchX;
        touchX = null;
        if (Math.abs(dx) < 40) return;
        if (dx < 0) showSlide(slideIndex + 1);
        else showSlide(slideIndex - 1);
    }, { passive: true });

    const hotspot = document.getElementById("secretHotspot");
    if (hotspot) {
        hotspot.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!isPcAdmin()) return;
            toggleAdminTools();
        });
    }

    const dlBtn = document.getElementById("pptDownloadBtn");
    if (dlBtn) dlBtn.onclick = () => downloadCurrentPpt();
    updateAdminToolsUi();

    window.addEventListener("resize", () => {
        updateLandscapeUi();
        updateAdminToolsUi();
    });
    window.addEventListener("orientationchange", () => setTimeout(() => {
        updateLandscapeUi();
        updateAdminToolsUi();
    }, 80));
    if (window.matchMedia) {
        window.matchMedia("(orientation: portrait)").addEventListener("change", () => {
            updateLandscapeUi();
            updateAdminToolsUi();
        });
    }

    armTouchGate();
    const onFsChange = () => {
        if (isNativeFullscreen()) applyPseudoFullscreen();
    };
    document.addEventListener("fullscreenchange", onFsChange);
    document.addEventListener("webkitfullscreenchange", onFsChange);
})();
</script>
</body>
</html>
