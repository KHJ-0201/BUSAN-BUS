<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 지역 배정 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { display: flex; gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #ddd; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        li:hover { background-color: #f0f0f0; }
        li.active { background-color: #007bff; color: white; font-weight: bold; }
        .delete-btn { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .region-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .region-btn { padding: 10px; border: 1px solid #ccc; background: white; border-radius: 5px; cursor: pointer; }
        .region-btn.selected { background-color: #28a745; color: white; border-color: #28a745; }
        .region-btn:disabled { background-color: #eee; cursor: not-allowed; color: #aaa; }
        input[type="text"], input[type="file"], button, select { padding: 8px; margin-top: 5px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; }
        .action-btn { background-color: #007bff; color: white; border: none; padding: 8px 15px; }
        .save-btn { background-color: #dc3545; color: white; border: none; padding: 15px; width: 100%; font-size: 1.1em; font-weight: bold; border-radius: 8px; margin-top: 20px; cursor: pointer; }
        .save-btn:hover { background-color: #c82333; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; min-height: 100px; border-radius: 8px; overflow-x: auto; }
        
        /* [CSS 최적화] 전체 표 글꼴 크기 축소 및 높이/여백 대폭 압축 */
        table { width:100%; border-collapse: collapse; text-align: center; margin-top: 15px; background: white; font-size: 0.9em; }
        th { background-color:#007bff; color:white; height: 26px; border: 1px solid #ddd; padding: 3px; }
        td { border: 1px solid #ddd; padding: 3px 5px; }
        
        .teacher-clickable { display: inline-block; padding: 2px 6px; margin: 1px; border: 1px solid #007bff; color: #007bff; background: white; border-radius: 12px; cursor: pointer; font-size: 0.85em; transition: 0.2s; }
        .teacher-clickable:hover { background-color: #007bff; color: white; }
        .teacher-clickable.duplicated { border-color: red; color: red; font-weight: bold; }
        .teacher-clickable.duplicated:hover { background-color: red; color: white; }
        /* [추가] 배정된 선생님 회색 처리 및 마우스 커서 비활성화 */
        .teacher-clickable.assigned { background-color: #f0f0f0 !important; color: #aaa !important; border-color: #ddd !important; cursor: default; }

        /* [CSS 최적화] 배정 영역 세로 정렬(column)을 해제하고 가로 정렬(flex-wrap)로 일원화 (절대 좌표 기준점 및 여백 확보) */
        .assignment-list { position: relative; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-items: center; width: 100%; min-height: 26px; padding-right: 45px; box-sizing: border-box; }
        /* [시인성 재조정] 배경/테두리 제거, 이름 텍스트만 굵고 선명하게 표시 */
        .assigned-teacher-tag { display: inline-flex; align-items: center; background: transparent; color: #222; padding: 2px 4px; font-size: 1.15em; font-weight: 900; letter-spacing: 0.5px; }
        .remove-teacher-btn { background: transparent; border: none; color: #dc3545; cursor: pointer; margin-left: 4px; padding: 0 4px; font-weight: bold; font-size: 0.9em; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .remove-teacher-btn:hover { color: #a71d2a; transform: scale(1.2); }
    
    @media (max-width: 768px) {
    body { padding: 10px; }
    .container { flex-direction: column; gap: 15px; }
    .panel { padding: 15px; width: 100%; box-sizing: border-box; }
    h2 { font-size: 1.2em; line-height: 1.3; }
    .region-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .region-btn { padding: 12px 5px; font-size: 0.85em; }
    table { font-size: 0.75em; min-width: 800px; }
    .result-box { padding: 5px; border: 1px solid #ddd; }
    .action-btn, .save-btn { width: 100%; padding: 12px; font-size: 1em; }
    .teacher-clickable { padding: 4px 8px; font-size: 0.9em; margin: 2px; }
    .assigned-teacher-tag { font-size: 1em; }
    .assignment-list { min-height: 40px; }
}
    </style>
</head>
<body>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin: 0;">🚗 교사 이동 지역 배정 시스템 (마스터 모드)</h2>
        <button style="padding: 10px 20px; border-radius: 6px; border: none; background-color: #6c757d; color: white; font-weight: bold; cursor: pointer; font-size: 1em;" onclick="location.href='index.html'">🔙 대문(로그인 화면)으로 이동</button>
    </div>

    <div class="container">
        <div class="panel">
            <h3>1. 선생님 명단</h3>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="teacherName" placeholder="선생님 이름 입력" style="flex: 1;">
                <button class="action-btn" onclick="addTeacher()">명단 추가</button>
            </div>
            <ul id="teacherList"></ul>
            
            <button class="save-btn" onclick="saveToDatabase()">💾 설정 내용 서버에 저장하기</button>
        </div>

        <div class="panel">
            <h3>2. 이동 가능 지역 선택</h3>
            <p id="selectionGuide" style="color: #666; font-size: 0.9em;">좌측에서 선생님을 선택하면 지역 설정이 활성화됩니다.</p>
            <div id="regionContainer" class="region-grid"></div>
        </div>
    </div>

    <div class="panel" style="margin-top: 20px;">
        <h3>3. 배차 엑셀 업로드 및 자동 배정</h3>
        <p style="color: #666; font-size: 0.9em;">계기판에서 가능 선생님을 클릭하면 배정 선생님 칸으로 이동하며, '전체 선생님 추가'로 모든 목록에서 추가할 수 있습니다.</p>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <button class="action-btn" onclick="processExcel()">엑셀 분석 및 배정 실행</button>
        <div class="result-box" id="resultArea">배정 결과가 여기에 출력됩니다.</div>
    </div>

<script src="지역배정.js"></script>
</body>
</body>
</html>
