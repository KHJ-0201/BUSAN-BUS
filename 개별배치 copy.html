<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 지역 배정 시스템 - 내 일정 확인</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=bcf6d2dc6e3d568e279b2d2cc3e4faf2&libraries=services"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; margin-top: 20px; }
        
        .header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007bff; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { color: #333; margin: 0; font-size: 1.6em; }
        .teacher-name-highlight { color: #007bff; font-size: 1.2em; font-weight: 900; }
        
        .back-btn { background-color: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .back-btn:hover { background-color: #5a6268; }

        .result-box { overflow-x: auto; }
        table { width:100%; border-collapse: collapse; text-align: center; background: white; font-size: 0.95em; min-width: 600px; }
        th { background-color:#007bff; color:white; height: 35px; border: 1px solid #ddd; padding: 5px; }
        td { border: 1px solid #ddd; padding: 10px 5px; }
        
        .co-teacher { display: inline-block; background-color: #e9ecef; padding: 3px 8px; border-radius: 12px; font-size: 0.9em; margin: 2px; border: 1px solid #ccc; color: #333; }
        .no-data { text-align: center; padding: 40px; color: #666; font-size: 1.1em; background: #f8f9fa; border-radius: 8px; }
        .loading { color: #888; font-style: italic; text-align: center; display: block; padding: 20px; }

        /* 학교명 클릭 유도 및 지도 프레임 디자인 */
        .school-link { color: #007bff; font-weight: bold; cursor: pointer; text-decoration: underline; transition: 0.2s; }
        .school-link:hover { color: #dc3545; }
        #map { width: 100%; height: 350px; border-radius: 8px; border: 1px solid #ccc; margin-top: 10px; }
        .map-title { font-weight: bold; margin-top: 20px; margin-bottom: 5px; color: #333; display: flex; align-items: center; gap: 5px; font-size: 1.1em; }
        
        /* 길찾기 버튼 디자인 */
        .navi-btn { display: inline-block; margin-top: 8px; padding: 6px 12px; background-color: #fee500; color: #3c1e1e; font-size: 12px; font-weight: bold; text-decoration: none; border-radius: 4px; border: 1px solid #ebcf00; }
        .navi-btn:hover { background-color: #fada00; }

       @media (max-width: 600px) {
    body { padding: 0; background-color: #fff; }
    .container { margin-top: 0; padding: 10px; border-radius: 0; box-shadow: none; box-sizing: border-box; }
    .header-area { padding-bottom: 8px; margin-bottom: 12px; }
    h2, .teacher-name-highlight { font-size: 1.1em; }
    .back-btn { padding: 5px 10px; font-size: 0.85em; }
    table { font-size: 0.75em; }
    td, th { padding: 8px 2px; }
    .map-title { font-size: 0.95em; margin-top: 15px; display: block; }
    .map-sub-title { display: block; font-size: 0.85em; font-weight: normal; color: #666; margin-top: 2px; }
    #map { height: 250px; }
}
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <h2><span id="displayTeacherName" class="teacher-name-highlight"></span> 전문가</h2>
            <button class="back-btn" onclick="goBack()">🔙 메인으로</button>
        </div>

        <div class="result-box" id="scheduleTableArea">
            <span class="loading">엔진 가동 중... 일정을 분석하고 있습니다.</span>
        </div>

        <div class="map-title">📍 배정 학교 위치 내비게이션 (표에서 학교명을 클릭하세요)</div>
        <div id="map"></div>
    </div>

<script src="개별배치.js"></script>
</body>
</body>
</html>
