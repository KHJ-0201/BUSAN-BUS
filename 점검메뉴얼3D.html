<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D 버스 점검 메뉴얼</title><script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script><style>*{box-sizing:border-box}body,html{margin:0;height:100%}body{font-family:'Malgun Gothic',sans-serif;background:#f4f4f9;color:#222;display:flex;flex-direction:column}.top-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.08);flex-wrap:wrap}.top-bar h2{margin:0;font-size:1.3em}.top-btn{padding:9px 16px;border-radius:6px;border:none;background:#6c757d;color:#fff;font-weight:700;cursor:pointer;font-size:.95em;white-space:nowrap}.main{flex:1;display:flex;gap:14px;padding:14px;min-height:0}.viewer-wrap{flex:1.6;position:relative;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;min-height:320px}#viewer{position:absolute;inset:0;touch-action:none}#viewer canvas{display:block}.view-toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:2}.view-toolbar>*{pointer-events:auto}.mode-btn{padding:8px 14px;border-radius:20px;border:2px solid #007bff;background:#fff;color:#007bff;font-weight:700;cursor:pointer;font-size:.9em}.mode-btn.active{background:#007bff;color:#fff}.spot-group{display:none;gap:4px;margin-left:6px;flex-wrap:wrap}.spot-group.show{display:flex}.spot-btn{padding:6px 10px;border-radius:14px;border:1px solid #adb5bd;background:rgba(255,255,255,.9);color:#333;font-size:.8em;font-weight:700;cursor:pointer}.cam-group{display:flex;gap:4px;margin-left:8px;padding-left:8px;border-left:2px solid rgba(0,0,0,.12)}.cam-btn{padding:8px 12px;border-radius:20px;border:2px solid #28a745;background:#fff;color:#28a745;font-weight:700;cursor:pointer;font-size:.85em}.cam-btn.active{background:#28a745;color:#fff}.joystick{position:absolute;left:18px;bottom:46px;width:110px;height:110px;border-radius:50%;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.6);display:none;touch-action:none;z-index:3}.joy-knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.3);pointer-events:none}.fp-action{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:none;padding:10px 18px;border:none;border-radius:22px;background:#f08c00;color:#fff;font-size:.95em;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer;z-index:3;animation:fpPulse 1.2s ease-in-out infinite}@keyframes fpPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}.reset-btn{margin-left:auto;padding:6px 10px;border-radius:14px;border:1px solid #adb5bd;background:rgba(255,255,255,.9);font-size:.8em;cursor:pointer}.view-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:.78em;padding:5px 12px;border-radius:12px;white-space:nowrap;pointer-events:none;z-index:2}.view-error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:#666}.slide-wrap{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);min-width:300px;overflow:hidden}.slide-head{padding:12px 16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:8px}.slide-head select{padding:6px;border-radius:6px;border:1px solid #ccc;max-width:70%;font-size:.9em}.slide-counter{font-size:.85em;color:#888;font-weight:700;white-space:nowrap}.slide-body{flex:1;overflow-y:auto;padding:18px 20px}.slide-tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:.75em;font-weight:700;margin-bottom:8px}.slide-tag.exterior{background:#cce5ff;color:#004085}.slide-tag.interior{background:#f8d7da;color:#721c24}.slide-title{margin:0 0 12px;font-size:1.35em;color:#007bff}.slide-content{line-height:1.7;font-size:.95em;color:#444}.slide-content ul{padding-left:20px;margin:8px 0}.slide-content .criteria{background:#fff5f5;border-left:4px solid #dc3545;padding:8px 12px;border-radius:4px;margin:10px 0}.slide-content .criteria ul{margin:4px 0 0}.slide-content .ex-title{margin:16px 0 6px;font-weight:700;color:#343a40;font-size:.95em}.slide-content .ex-fig{margin:0 0 10px;background:#fff;border:1px solid #dee2e6;border-radius:10px;padding:8px}.slide-content .ex-photo{position:relative;border-radius:6px;overflow:hidden;background:#e9ecef;aspect-ratio:2/1}.slide-content .ex-photo img{width:100%;height:100%;object-fit:cover;display:block}.slide-content .ex-tag{position:absolute;top:6px;transform:translateX(-50%);padding:2px 8px;border-radius:10px;font-size:.78em;font-weight:700;color:#fff;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35)}.slide-content .ex-tag.ok{background:rgba(47,158,68,.92)}.slide-content .ex-tag.ng{background:rgba(224,49,49,.92)}.slide-content .ex-fig figcaption{font-size:.82em;color:#495057;margin-top:4px;line-height:1.45}.slide-content .tip{background:#eef7ff;border-left:4px solid #17a2b8;padding:8px 12px;border-radius:4px;margin:10px 0;font-size:.92em}.slide-content .todo{color:#aaa;font-style:italic}.slide-nav{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid #eee}.nav-btn{flex:0 0 auto;padding:10px 18px;border-radius:6px;border:none;background:#007bff;color:#fff;font-weight:700;cursor:pointer;font-size:.95em}.nav-btn:disabled{background:#ced4da;cursor:default}.slide-dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:50%;background:#ced4da;cursor:pointer}.dot.active{background:#007bff;transform:scale(1.3)}@media (max-width:900px){.main{flex-direction:column;padding:8px;gap:8px}.viewer-wrap{flex:none;height:52vh}.slide-wrap{flex:1;min-width:0;min-height:260px}.top-bar{padding:10px 12px}.top-bar h2{font-size:1.05em}.mode-btn{padding:7px 11px;font-size:.82em}.cam-group{margin-left:0;padding-left:0;border-left:none}.cam-btn{padding:6px 10px;font-size:.8em}}</style></head><body><div class="top-bar"><h2>🚌 3D 버스 점검 메뉴얼</h2><button class="top-btn" onclick="goBack()">🔙 돌아가기</button></div><div class="main"><div class="viewer-wrap"><div id="viewer"></div><div class="view-toolbar"><button class="mode-btn active" id="modeExterior" onclick='setViewMode("exterior")'>🚌 외관</button> <button class="mode-btn" id="modeInterior" onclick='setViewMode("interior")'>💺 실내</button> <button class="mode-btn" id="modeUnderbody" onclick='setViewMode("underbody")'>🔧 하체</button><div class="cam-group"><button class="cam-btn active" id="camThird" onclick='setCameraMode("third")'>🎥 3인칭</button> <button class="cam-btn" id="camFirst" onclick='setCameraMode("first")'>🚶 1인칭</button> <button class="spot-btn" id="crouchBtn" style="display:none" onclick="toggleCrouch()">🧎 앉기</button></div><div class="spot-group" id="interiorSpots"><button class="spot-btn" onclick='goInteriorSpot("driver")'>운전석</button> <button class="spot-btn" onclick='goInteriorSpot("front")'>앞쪽</button> <button class="spot-btn" onclick='goInteriorSpot("middle")'>중간</button> <button class="spot-btn" onclick='goInteriorSpot("rear")'>뒤쪽</button></div><button class="reset-btn" onclick="resetView()">↺ 시점 초기화</button></div><div class="joystick" id="joystick"><div class="joy-knob" id="joyKnob"></div></div><button class="fp-action" id="oilPanBtn" onclick="lookOilPan()">⬇ 엔진 오일팬 확인</button><div class="view-hint" id="viewHint">드래그: 회전 · 두 손가락/휠: 확대</div><div class="view-error" id="viewError">이 기기/브라우저에서는 3D 화면을 표시할 수 없습니다.<br>(크롬 최신 버전에서 열어 주세요)</div></div><div class="slide-wrap"><div class="slide-head"><select id="slideSelect" onchange="goSlide(Number(this.value))"></select> <span class="slide-counter" id="slideCounter"></span></div><div class="slide-body" id="slideBody"></div><div class="slide-nav"><button class="nav-btn" id="prevBtn" onclick="prevSlide()">◀ 이전</button><div class="slide-dots" id="slideDots"></div><button class="nav-btn" id="nextBtn" onclick="nextSlide()">다음 ▶</button></div></div></div><script src="점검메뉴얼3D.js"></script></body></html>
